      - /dev/sda:/host_dev/sda:ro
      - ../config/DSE_FIX/dse_fix_config.py:/engine/config.py
      - ../config/DSE_FIX/engine.properties:/engine/engine.properties
      - ../config/DSE_FIX/engine.license:/engine/engine.license
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
