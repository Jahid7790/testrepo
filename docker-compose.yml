# version: '3.8'

services:
  # qTrader Services
  # GUNICORN Worker per container = (2 x num of cores + 1) / total num containers
  qtrader_broker:
    image: 192.168.155.22:5000/qtrader_app:2.0.7
    logging:
      driver: syslog
    command: ["gunicorn", "--reload", "--workers=5","--worker-class=gevent", "--worker-connections=1000", "--timeout=120", "-b", "0.0.0.0:5657", "app:app"]
    ports:  
      - 5501-5505:5657
    depends_on:
      - redis
    env_file:
      - '.env'
    volumes:
      - ../protected:/app/app/protected
      - ../protected/static/uploads:/app/app/static/uploads
      - ../branding/broker-logo-dark.png:/app/app/static/images/broker-logo-dark.png
      - ../branding/broker-logo-light.png:/app/app/static/images/broker-logo-light.png
      - ../config/qtrader/broker_config.py:/app/app/config.py
      - ../config/qtrader/file_config.py:/app/app/file_config.py
      - ../config/qtrader/ws_config.js:/app/app/static/js/feeds/ws_config.js
    deploy:
      replicas: 5
    restart: unless-stopped
  
  qtrader_broker_trade:
    image: 192.168.155.22:5000/qtrader_app:2.0.7
    logging:
      driver: syslog
    command: ["gunicorn", "--reload", "--workers=3","--worker-class=gevent", "--worker-connections=1000", "--timeout=120", "-b", "0.0.0.0:5657", "app:app"]
    ports:  
      - 5551-5553:5657
    depends_on:
      - redis
    env_file:
      - '.env'
    volumes:
      - ../protected:/app/app/protected
      - ../protected/static/uploads:/app/app/static/uploads
      - ../branding/broker-logo-dark.png:/app/app/static/images/broker-logo-dark.png
      - ../branding/broker-logo-light.png:/app/app/static/images/broker-logo-light.png
      - ../config/qtrader/broker_config.py:/app/app/config.py
      - ../config/qtrader/file_config.py:/app/app/file_config.py
      - ../config/qtrader/ws_config.js:/app/app/static/js/feeds/ws_config.js
    deploy:
      replicas: 3
    restart: unless-stopped

  celery:
    image: 192.168.155.22:5000/qtrader_app:2.0.7
    logging:
      driver: syslog
    container_name: celery
    command: celery --app app.tasks.celery worker -l INFO -E
    volumes:
      - ../config/qtrader/broker_config.py:/app/app/config.py
    env_file:
      - '.env'
    links:
      - redis
    depends_on:
      - redis
    restart: unless-stopped
  
  celery-beat:
      image: 192.168.155.22:5000/qtrader_app:2.0.7
      logging:
        driver: syslog
      container_name: celery-beat
      command: celery --app app.tasks.celery beat -l INFO
      volumes:
      - ../config/qtrader/broker_config.py:/app/app/config.py
      env_file:
        - '.env'
      links:
        - celery
        - redis
      depends_on:
        - celery
        - redis
      restart: unless-stopped

  # DSE FIX Engine Services
  fix-engine:
    network_mode: host
    image: 192.168.155.22:5000/fix_engine:1.1.09
    logging:
